<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字進級テスト（前期）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #fffaf0;
            background-image:
                radial-gradient(#ffd57a 15%, transparent 16%),
                radial-gradient(#ffb961 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .cell-content {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 2px;
        }

        .item-icon {
            font-size: 2.2rem;
            transition: all 0.3s ease;
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        .element-badge {
            width: 56px;
            height: 56px;
            object-fit: contain;
            display: block;
        }

        .cell-select {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            z-index: 2;
        }

        .cell-selected {
            outline: 4px solid #60a5fa;
            outline-offset: -4px;
        }

        .item-date {
            font-size: 0.55rem;
            color: #6b7280;
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        .item-unpassed {
            opacity: 0.2;
            filter: grayscale(100%);
            transform: scale(0.8);
        }

        .item-passed {
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
        }

        .item-passed-lap2 {
            opacity: 0.6;
            filter: drop-shadow(0 0 8px rgba(100, 180, 255, 0.9));
        }

        /* 挑戦可能マスのフワフワアニメーション */
        @keyframes float-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .item-challenge {
            opacity: 0.7;
            filter: grayscale(100%);
            animation: float-subtle 2s ease-in-out infinite;
        }

        @keyframes pop-in {
            0%   { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            50%  { transform: scale(1.2) rotate(5deg);  opacity: 1; }
            100% { transform: scale(1)   rotate(0deg);  opacity: 1; }
        }
        .do-pop { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .item-locked {
            opacity: 0.35;
            font-size: 1.6rem;
        }

        .test-table th, .test-table td {
            border: 2px solid #374151;
        }

        .col-cleared  { background-color: #fef9c3 !important; }
        .row-cleared  { background-color: #dcfce7 !important; }
        .both-cleared { background-color: #bbf7d0 !important; }
        .lap2-cell    { background-color: #eff6ff !important; }

        #progressBar { transition: width 0.5s ease; }

        #modalImageArea {
            flex: 1 1 0%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            overflow: hidden;
            padding: 8px;
            position: relative;
        }

        #modalImage {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 14px;
            top: -20px;
            border-radius: 2px;
            animation: confetti-fall linear forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes confetti-fall {
            0%   { transform: translateY(0) rotateZ(0deg); opacity:1; }
            90%  { opacity:1; }
            100% { transform: translateY(110vh) rotateZ(720deg); opacity:0; }
        }

        #allClearBanner {
            animation: banner-in 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        @keyframes banner-in {
            0%   { transform: scale(0.5); opacity:0; }
            100% { transform: scale(1);   opacity:1; }
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

    <div class="max-w-5xl mx-auto bg-white/95 backdrop-blur-sm rounded-3xl shadow-xl p-6 md:p-10 border-4 border-orange-100">

        <!-- ヘッダー -->
        <div class="flex flex-wrap items-end justify-between gap-4 mb-6 border-b-4 border-orange-300 pb-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800 tracking-wider">
                    漢字進級テスト
                    <span class="text-2xl md:text-3xl text-gray-600">（前期）</span>
                </h1>
                <div id="lapBadge" class="hidden mt-1 inline-block bg-blue-500 text-white text-sm font-bold px-3 py-1 rounded-full">
                    🔄 2周目チャレンジ中！
                </div>
            </div>
            <!-- プログレスバー -->
            <div class="flex-1 min-w-[200px]">
                <div class="flex justify-between text-sm text-gray-500 mb-1">
                    <span>クリア進捗</span>
                    <span id="progressText">0 / 36</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-5 overflow-hidden">
                    <div id="progressBar" class="h-5 rounded-full bg-gradient-to-r from-orange-400 to-red-500" style="width:0%"></div>
                </div>
            </div>
        </div>

        <div class="mb-8 text-lg md:text-xl leading-relaxed bg-orange-50 p-4 rounded-xl border border-orange-200">
            <p>💯 <span class="font-bold text-red-500">100点満点、80点以上で合格！</span> 次に進めます！</p>
            <p>🚶‍♂️ 進み方は二通り。 ①レベルを上げる！ ②先に進む。 どちらか自分で選んで進めてください。</p>
        </div>

        <!-- 表1: 1〜6級 -->
        <div class="overflow-x-auto mb-8">
            <table class="test-table w-full bg-white text-center text-lg">
                <thead>
                    <tr class="bg-orange-100">
                        <th class="py-3 px-2 w-24">級</th>
                        <th class="py-3 px-2 w-1/6">1</th>
                        <th class="py-3 px-2 w-1/6">2</th>
                        <th class="py-3 px-2 w-1/6">3</th>
                        <th class="py-3 px-2 w-1/6">4</th>
                        <th class="py-3 px-2 w-1/6">5</th>
                        <th class="py-3 px-2 w-1/6">6</th>
                    </tr>
                </thead>
                <tbody id="tableBody1"></tbody>
            </table>
        </div>

        <!-- 表2: 7〜12級 -->
        <div class="overflow-x-auto mb-8">
            <table class="test-table w-full bg-white text-center text-lg">
                <thead>
                    <tr class="bg-orange-100">
                        <th class="py-3 px-2 w-24">級</th>
                        <th class="py-3 px-2 w-1/6">7</th>
                        <th class="py-3 px-2 w-1/6">8</th>
                        <th class="py-3 px-2 w-1/6">9</th>
                        <th class="py-3 px-2 w-1/6">10</th>
                        <th class="py-3 px-2 w-1/6">11</th>
                        <th class="py-3 px-2 w-1/6">12</th>
                    </tr>
                </thead>
                <tbody id="tableBody2"></tbody>
            </table>
        </div>

        <!-- 全クリアバナー -->
        <div id="allClearBanner" class="hidden mb-8 bg-gradient-to-r from-yellow-300 to-orange-400 rounded-2xl p-6 text-center shadow-xl border-4 border-yellow-500">
            <div class="text-5xl mb-3">🏆✨🐉✨🏆</div>
            <p class="text-2xl font-bold text-white mb-1">全ステージクリア！すごい！</p>
            <p class="text-white mb-5">全36ステージを制覇しました！！</p>
            <button onclick="startLap2()"
                    class="bg-white text-orange-500 font-bold text-xl px-8 py-3 rounded-full shadow-lg hover:bg-orange-50 transition-all hover:scale-105">
                🔄 2周目スタート！
            </button>
        </div>

        <div class="mt-4 flex flex-wrap justify-end items-center gap-4">
            <button id="bulkPassButton" onclick="handleBulkPassButton()"
                    class="text-sm font-bold text-blue-500 hover:text-blue-700 underline transition-colors">
                🛡️ 一括合格を選択
            </button>
            <button onclick="resetProgress()" class="text-sm text-gray-400 hover:text-red-500 underline transition-colors">
                冒険の記録（クリア履歴）をすべてリセットする
            </button>
        </div>
    </div>

    <!-- ===== メインモーダル ===== -->
    <div id="testModal" class="fixed inset-0 z-50 hidden flex-col items-center justify-center p-2"
         style="background:rgba(0,0,0,0.88);">
        <div class="bg-white rounded-2xl shadow-2xl w-full flex flex-col overflow-hidden relative transform transition-all scale-95 opacity-0"
             id="modalContent" style="max-width:98vw; height:96vh;">

            <!-- ヘッダー -->
            <div class="bg-orange-400 text-white px-4 py-3 flex justify-between items-center shadow-md flex-shrink-0 gap-3">
                <h2 id="modalTitle" class="text-xl font-bold tracking-wide flex-1">級・レベル</h2>
                <button onclick="closeModal()" class="text-white hover:text-orange-200 focus:outline-none transition-colors flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- 画像エリア -->
            <div id="modalImageArea">
                <img id="modalImage" src="" alt="テスト画像" style="display:none;" onerror="showImageError()">
                <div id="imagePlaceholder" class="hidden text-center text-gray-400 p-12">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <p class="text-lg mb-2 font-bold text-gray-300">画像の準備ができていません</p>
                    <p class="text-sm text-gray-500">以下のパスに画像を配置してください：</p>
                    <code id="expectedPath" class="block mt-2 bg-gray-800 p-2 rounded text-orange-400 font-mono text-sm"></code>
                </div>
            </div>

            <!-- フッター -->
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-between items-center flex-shrink-0">
                <span class="text-gray-400 text-sm hidden md:block">※画像を右クリックして保存・印刷できます</span>
                <button id="passButton"
                        class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-all text-xl flex items-center gap-2 ml-auto">
                    🔥 クリア！
                </button>
            </div>
        </div>
    </div>

    <!-- パスワードモーダル -->
    <div id="passwordModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0" id="passwordModalContent">
            <h3 class="text-xl font-bold mb-5 text-gray-800">先生にパスワードを入力<br>してもらってね！</h3>
            
            <input type="password" id="passwordInput" inputmode="numeric" pattern="[0-9]*"
                   class="w-full border-2 border-gray-300 rounded-lg p-3 mb-4 text-center text-2xl tracking-widest focus:outline-none focus:border-orange-500"
                   placeholder="***">
            <p id="passwordError" class="text-red-500 text-sm mb-4 hidden font-bold">パスワードがちがいます！</p>
            <div class="flex justify-center gap-4">
                <button onclick="closePasswordModal()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-300 transition-colors font-bold">キャンセル</button>
                <button onclick="checkPassword()" class="px-6 py-3 bg-orange-500 text-white rounded-full hover:bg-orange-600 transition-colors font-bold">けってい</button>
            </div>
        </div>
    </div>

    <!-- 確認モーダル -->
    <div id="confirmModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0" id="confirmModalContent">
            <h3 id="confirmTitle" class="text-lg font-bold mb-6 text-gray-800 whitespace-pre-line">かくにん</h3>
            <div class="flex justify-center gap-4">
                <button onclick="closeConfirmModal()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-300 transition-colors font-bold">やめる</button>
                <button id="confirmActionButton" class="px-6 py-3 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors font-bold">はい</button>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    // 定数
    // ============================================================

        // ============================================================
    // 定数（Edge表示最適化版）
    // ============================================================
    const TOTAL_CELLS    = 36;
    const selectedCellIds = new Set();

    // 級ごとのエレメント.各級は同じ属性の Lv.1 → Lv.2 → Lv.3 でそろえる。
    const elementByKyu = {
        1: { slug: 'fire',    name: '炎' },
        2: { slug: 'water',   name: '水' },
        3: { slug: 'nature',  name: '自然' },
        4: { slug: 'thunder', name: '雷' },
        5: { slug: 'ice',     name: '氷' },
        6: { slug: 'shadow',  name: '影' },
        7: { slug: 'gravity', name: '重力' },
        8: { slug: 'wind',   name: '風' },
        9: { slug: 'earth',  name: '大地' },
        10:{ slug: 'light',  name: '光' },
        11:{ slug: 'moon',   name: '月' },
        12:{ slug: 'psychic', name: 'エスパー' }
    };

    function getElementBadge(kyu, level) {
        const element = elementByKyu[kyu];
        return {
            ...element,
            url: `https://tt-sensei.github.io/edu-assets/assets/web/elements/${element.slug}/level-${level}/badge.webp`
        };
    }

    // パスワードルール：級+レベル+8
    function getPassword(kyu, level) { return `${kyu}${level}8`; }

    // ============================================================
    // 状態管理（ローカルストレージのみ）
    // ============================================================
    const state = {
        passedDates : JSON.parse(localStorage.getItem('kanjiPassedDates') || '{}'),
        lap1Records : new Set(JSON.parse(localStorage.getItem('kanjiLap1Records') || '[]')),
        lap         : parseInt(localStorage.getItem('kanjiLap') || '1')
    };

    function saveData() {
        localStorage.setItem('kanjiPassedDates',   JSON.stringify(state.passedDates));
        localStorage.setItem('kanjiLap1Records',   JSON.stringify([...state.lap1Records]));
        localStorage.setItem('kanjiLap',           String(state.lap));
    }

    function isPassed(id)  { return !!state.passedDates[id]; }
    function isLap1(id)    { return state.lap1Records.has(id); }
    function passedList()  { return Object.keys(state.passedDates); }
    function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    }

    // ============================================================
    // 解放制御
    // ============================================================
    function parseId(id) {
        const m = id.match(/level-(\d+)-kyu-(\d+)/);
        return { level: parseInt(m[1]), kyu: parseInt(m[2]) };
    }

    function calcUnlocked() {
        const u = new Set(['level-1-kyu-1']);
        passedList().forEach(id => {
            const { level, kyu } = parseId(id);
            if      (level === 1) { u.add(`level-2-kyu-${kyu}`); if (kyu < 12) u.add(`level-1-kyu-${kyu+1}`); }
            else if (level === 2) { u.add(`level-3-kyu-${kyu}`); }
            else if (level === 3) { if (kyu < 12) u.add(`level-1-kyu-${kyu+1}`); }
            u.add(id);
        });
        return u;
    }
    function isUnlocked(id) { return calcUnlocked().has(id); }

    // ============================================================
    // 色判定
    // ============================================================
    function isKyuAllCleared(kyu)     { return [1,2,3].every(lv => isPassed(`level-${lv}-kyu-${kyu}`)); }
    function isLevelAllCleared(level) { return Array.from({length:12},(_,i)=>i+1).every(k => isPassed(`level-${level}-kyu-${k}`)); }

    // ============================================================
    // テーブル生成
    // ============================================================
    function generateTable(tbodyId, startKyu) {
        const tbody = document.getElementById(tbodyId);
        const levelNames = ['レベル１','レベル２','レベル３'];

        levelNames.forEach((levelName, li) => {
            const level = li + 1;
            const levelClear = isLevelAllCleared(level);
            const tr = document.createElement('tr');

            const th = document.createElement('th');
            th.className = 'py-3 px-2 bg-orange-50';
            if (levelClear) th.classList.add('row-cleared');
            th.textContent = levelName;
            tr.appendChild(th);

            for (let i = 0; i < 6; i++) {
                const kyu    = startKyu + i;
                const cellId = `level-${level}-kyu-${kyu}`;
                const badge = getElementBadge(kyu, level);

                const unlocked  = isUnlocked(cellId);
                const passed    = isPassed(cellId);
                const lap1Done  = isLap1(cellId);
                const kyuClear  = isKyuAllCleared(kyu);

                // アイコン
                let iconHtml, iconCls;
                if (!unlocked) {
                    iconHtml = '🔒'; iconCls = 'item-locked';
                } else {
                    iconHtml = `<img class="element-badge" src="${badge.url}" alt="${badge.name}エレメント Lv.${level}">`;
                    iconCls = passed
                        ? ((state.lap === 2 && lap1Done) ? 'item-passed-lap2' : 'item-passed do-pop')
                        : 'item-challenge';
                }

                const dateStr = passed ? state.passedDates[cellId] : '';

                const td = document.createElement('td');
                td.className = 'p-0 cursor-pointer hover:bg-orange-100 transition-colors duration-200';
                if      (kyuClear && levelClear) td.classList.add('both-cleared');
                else if (kyuClear)               td.classList.add('col-cleared');
                else if (levelClear)             td.classList.add('row-cleared');
                if (state.lap === 2 && lap1Done && !passed) td.classList.add('lap2-cell');

                td.onclick = () => openModal(cellId, kyu, levelName, `kanji_test_${level}`, `${kyu}.jpg`, badge.name, level);
                if (selectedCellIds.has(cellId)) td.classList.add('cell-selected');
                // 一括選択モードでは、鍵付きステージも解放条件を飛ばして選択可能。
                const selectDisabled = passed;
                td.innerHTML = `
                    <div class="cell-content">
                        <input class="cell-select" type="checkbox"
                               aria-label="${kyu}級 レベル${level}を選択"
                               ${selectedCellIds.has(cellId) ? 'checked' : ''}
                               ${selectDisabled ? 'disabled' : ''}
                               onclick="event.stopPropagation()"
                               style="${bulkSelectMode ? '' : 'display:none;'}"
                               onchange="toggleCellSelection('${cellId}', this.checked)">
                        <span id="icon-${cellId}" class="item-icon ${iconCls}">${iconHtml}</span>
                        <span class="item-date">${dateStr}</span>
                    </div>`;
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        });
    }

    function refreshTable() {
        document.getElementById('tableBody1').innerHTML = '';
        document.getElementById('tableBody2').innerHTML = '';
        generateTable('tableBody1', 1);
        generateTable('tableBody2', 7);
        updateProgress();
        checkAllClear();
    }

    // ============================================================
    // プログレスバー
    // ============================================================
    function updateProgress() {
        const n = passedList().length;
        document.getElementById('progressText').textContent = `${n} / ${TOTAL_CELLS}`;
        document.getElementById('progressBar').style.width  = `${(n / TOTAL_CELLS) * 100}%`;
    }

    // ============================================================
    // 全クリア
    // ============================================================
    function checkAllClear() {
        const banner = document.getElementById('allClearBanner');
        passedList().length >= TOTAL_CELLS
            ? banner.classList.remove('hidden')
            : banner.classList.add('hidden');
    }

    // ============================================================
    // 2周目
    // ============================================================
    function startLap2() {
        openConfirmModal('2周目をスタートします！\n1周目のクリア記録は色を変えて残ります。\nよろしいですか？', () => {
            state.lap1Records = new Set(passedList());
            state.passedDates = {};
            state.lap = 2;
            saveData();
            document.getElementById('lapBadge').classList.remove('hidden');
            refreshTable();
        });
    }

    // ============================================================
    // confetti (紙吹雪演出)
    // ============================================================
    function launchConfetti() {
        const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9f43','#ee5a24','#a29bfe'];
        for (let i = 0; i < 70; i++) {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left              = Math.random() * 100 + 'vw';
            el.style.background        = colors[Math.floor(Math.random() * colors.length)];
            el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
            el.style.animationDelay    = (Math.random() * 0.6) + 's';
            el.style.transform         = `rotateZ(${Math.random()*360}deg)`;
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }
    }

    // ============================================================
    // モーダル
    // ============================================================
    let currentCellId = '';
    let currentKyu    = 1;
    let currentLevel  = 1;
    let currentEmoji  = '';

    const modal            = document.getElementById('testModal');
    const modalContent     = document.getElementById('modalContent');
    const modalTitle       = document.getElementById('modalTitle');
    const modalImage       = document.getElementById('modalImage');
    const imagePlaceholder = document.getElementById('imagePlaceholder');
    const expectedPath     = document.getElementById('expectedPath');
    const passButton       = document.getElementById('passButton');

    function openModal(cellId, kyu, levelName, folder, file, emoji, level) {
        currentCellId = cellId;
        currentKyu    = kyu;
        currentLevel  = level;
        currentEmoji  = emoji;

        modalTitle.textContent = `${kyu}級 - ${levelName}`;
        modalImage.style.display = 'none';
        imagePlaceholder.classList.add('hidden');
        modalImage.src = '';

        applyPassButtonState();

        modalImage.onload = () => {
            modalImage.style.display = 'block';
            imagePlaceholder.classList.add('hidden');
        };

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => {
            modalContent.classList.remove('scale-95','opacity-0');
            modalContent.classList.add('scale-100','opacity-100');
            modalImage.src = `${folder}/${file}`;
        }, 10);
    }

    function applyPassButtonState() {
        passButton.disabled = false;
        passButton.classList.remove(
            'bg-red-500','hover:bg-red-600','active:bg-red-700',
            'bg-gray-400','hover:bg-gray-500','active:bg-gray-600',
            'bg-gray-300','cursor-not-allowed','opacity-50'
        );
        if (isPassed(currentCellId)) {
            passButton.innerHTML = '✨ クリア済み（取り消す）';
            passButton.classList.add('bg-gray-400','hover:bg-gray-500','active:bg-gray-600');
        } else if (!isUnlocked(currentCellId)) {
            passButton.innerHTML = '🔒 まだ解放されていません';
            passButton.disabled = true;
            passButton.classList.add('bg-gray-300','cursor-not-allowed','opacity-50');
        } else {
            passButton.innerHTML = `🔥 クリア！（${currentEmoji} ゲット）`;
            passButton.classList.add('bg-red-500','hover:bg-red-600','active:bg-red-700');
        }
    }

    function showImageError() {
        modalImage.style.display = 'none';
        imagePlaceholder.classList.remove('hidden');
        expectedPath.textContent = modalImage.getAttribute('src');
    }

    function closeModal() {
        modalContent.classList.remove('scale-100','opacity-100');
        modalContent.classList.add('scale-95','opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }, 300);
    }

    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    // ============================================================
    // パスワードモーダル
    // ============================================================
    const passwordModal        = document.getElementById('passwordModal');
    const passwordModalContent = document.getElementById('passwordModalContent');
    const passwordInput        = document.getElementById('passwordInput');
    const passwordError        = document.getElementById('passwordError');

    let bulkPassMode = false;

    let bulkSelectMode = false;

    function toggleCellSelection(cellId, checked) {
        if (checked) selectedCellIds.add(cellId);
        else selectedCellIds.delete(cellId);
        refreshTable();
    }

    function handleBulkPassButton() {
        if (!bulkSelectMode) {
            bulkSelectMode = true;
            document.getElementById('bulkPassButton').textContent = '✅ 選択したものを一括合格';
            refreshTable();
            return;
        }
        if (selectedCellIds.size === 0) {
            alert('合格させたいステージを選択してください。');
            return;
        }
        bulkPassMode = true;
        openPasswordModal();
    }

    function openPasswordModal() {
        passwordInput.value = '';
        passwordError.classList.add('hidden');
        passwordModal.classList.remove('hidden');
        passwordModal.classList.add('flex');
        setTimeout(() => {
            passwordModalContent.classList.remove('scale-95','opacity-0');
            passwordModalContent.classList.add('scale-100','opacity-100');
            passwordInput.focus();
        }, 10);
    }

    function closePasswordModal() {
        bulkPassMode = false;
        passwordModalContent.classList.remove('scale-100','opacity-100');
        passwordModalContent.classList.add('scale-95','opacity-0');
        setTimeout(() => {
            passwordModal.classList.add('hidden');
            passwordModal.classList.remove('flex');
        }, 300);
    }

    passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });

    function checkPassword() {
        if (bulkPassMode) {
            if (passwordInput.value === '8818') {
                closePasswordModal();
                executeBulkPass();
            } else {
                passwordError.classList.remove('hidden');
                passwordInput.value = '';
                passwordInput.focus();
            }
        } else if (passwordInput.value === getPassword(currentKyu, currentLevel)) {
            closePasswordModal();
            executePass();
        } else {
            passwordError.classList.remove('hidden');
            passwordInput.value = '';
            passwordInput.focus();
        }
    }

    // ============================================================
    // 確認モーダル
    // ============================================================
    const confirmModal        = document.getElementById('confirmModal');
    const confirmModalContent = document.getElementById('confirmModalContent');
    const confirmTitle        = document.getElementById('confirmTitle');
    const confirmActionButton = document.getElementById('confirmActionButton');
    let confirmAction = null;

    function openConfirmModal(message, action) {
        confirmTitle.textContent = message;
        confirmAction = action;
        confirmModal.classList.remove('hidden');
        confirmModal.classList.add('flex');
        setTimeout(() => {
            confirmModalContent.classList.remove('scale-95','opacity-0');
            confirmModalContent.classList.add('scale-100','opacity-100');
        }, 10);
    }

    function closeConfirmModal() {
        confirmModalContent.classList.remove('scale-100','opacity-100');
        confirmModalContent.classList.add('scale-95','opacity-0');
        setTimeout(() => {
            confirmModal.classList.add('hidden');
            confirmModal.classList.remove('flex');
            confirmAction = null;
        }, 300);
    }

    confirmActionButton.addEventListener('click', () => {
        if (confirmAction) confirmAction();
        closeConfirmModal();
    });

    // ============================================================
    // クリア / 取り消し
    // ============================================================
    function executePass() {
        state.passedDates[currentCellId] = todayStr();
        saveData();
        launchConfetti();
        refreshTable();
        closeModal();
    }

    function executeCancel() {
        delete state.passedDates[currentCellId];
        saveData();
        refreshTable();
        closeModal();
    }

    function executeBulkPass() {
        selectedCellIds.forEach(cellId => {
            state.passedDates[cellId] = todayStr();
        });
        selectedCellIds.clear();
        saveData();
        launchConfetti();
        refreshTable();
    }

    passButton.addEventListener('click', () => {
        if (isPassed(currentCellId))      { openConfirmModal('クリアを取り消しますか？', executeCancel); }
        else if (isUnlocked(currentCellId)) { openPasswordModal(); }
    });

    // ============================================================
    // リセット
    // ============================================================
    function resetProgress() {
        openConfirmModal('今までの「🔥 クリア」の記録をすべて消去します。\n本当によろしいですか？', () => {
            ['kanjiPassedDates','kanjiPassedRecords','kanjiLap1Records','kanjiLap'].forEach(k => localStorage.removeItem(k));
            location.reload();
        });
    }

    // ============================================================
    // 初期化
    // ============================================================
    if (state.lap === 2) document.getElementById('lapBadge').classList.remove('hidden');
    generateTable('tableBody1', 1);
    generateTable('tableBody2', 7);
    updateProgress();
    checkAllClear();
    </script>
</body>
</html>
