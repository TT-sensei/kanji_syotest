name: Apply kanji test badge map
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update badge map
        run: |
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(encoding='utf-8'); new=\"\"\"const elementByKyu = {\n        1: { slug: 'fire', name: '炎' },\n        2: { slug: 'water', name: '水' },\n        3: { slug: 'nature', name: '自然' },\n        4: { slug: 'thunder', name: '雷' },\n        5: { slug: 'ice', name: '氷' },\n        6: { slug: 'shadow', name: '影' },\n        7: { slug: 'gravity', name: '重力' },\n        8: { slug: 'wind', name: '風' },\n        9: { slug: 'earth', name: '大地' },\n        10: { slug: 'light', name: '光' },\n        11: { slug: 'moon', name: '月' },\n        12: { slug: 'psychic', name: 'エスパー' },\n        13: { slug: 'bubble', name: 'バブル' },\n        14: { slug: 'candy', name: 'キャンディ' },\n        15: { slug: 'cloud', name: '雲' },\n        16: { slug: 'cosmos', name: '宇宙' },\n        17: { slug: 'dream', name: '夢' },\n        18: { slug: 'fairy', name: '妖精' },\n        19: { slug: 'flower', name: '花' },\n        20: { slug: 'heart', name: 'ハート' },\n        21: { slug: 'luck', name: '幸運' },\n        22: { slug: 'rain', name: '雨' },\n        23: { slug: 'rainbow', name: '虹' },\n        24: { slug: 'sound', name: '音' }\n    };\"\"\"; s2,n=re.subn(r'const elementByKyu = \\{.*?\\n    \\};',new,s,count=1,flags=re.S); assert n==1; p.write_text(s2,encoding='utf-8')"
      - name: Commit badge map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '後期13〜24級に未使用バッジを設定'
          git push
