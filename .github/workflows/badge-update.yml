name: Apply kanji test badge map
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update badge map
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = '''const elementByKyu = {
        1: { slug: 'fire',    name: '炎' },
        2: { slug: 'water',   name: '水' },
        3: { slug: 'nature',  name: '自然' },
        4: { slug: 'thunder', name: '雷' },
        5: { slug: 'ice',     name: '氷' },
        6: { slug: 'shadow',  name: '影' },
        7: { slug: 'gravity', name: '重力' },
        8: { slug: 'wind',    name: '風' },
        9: { slug: 'earth',   name: '大地' },
        10:{ slug: 'light',   name: '光' },
        11:{ slug: 'moon',    name: '月' },
        12:{ slug: 'psychic', name: 'エスパー' },
        13:{ slug: 'bubble',  name: 'バブル' },
        14:{ slug: 'candy',   name: 'キャンディ' },
        15:{ slug: 'cloud',   name: '雲' },
        16:{ slug: 'cosmos',  name: '宇宙' },
        17:{ slug: 'dream',   name: '夢' },
        18:{ slug: 'fairy',   name: '妖精' },
        19:{ slug: 'flower',  name: '花' },
        20:{ slug: 'heart',   name: 'ハート' },
        21:{ slug: 'luck',    name: '幸運' },
        22:{ slug: 'rain',    name: '雨' },
        23:{ slug: 'rainbow', name: '虹' },
        24:{ slug: 'sound',   name: '音' }
    };'''
          pattern = r"const elementByKyu = \{.*?\n    \};"
          s2, n = re.subn(pattern, new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('elementByKyu block not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit badge map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '後期13〜24級に未使用バッジを設定'
          git push
