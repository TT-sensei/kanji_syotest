name: Add semester switch
on:
  push:
    paths:
      - '.semester-update-trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add a semester toggle near the title without disturbing the existing front-term layout.
          marker = '''<div id="lapBadge" class="hidden mt-1 inline-block bg-blue-500 text-white text-sm font-bold px-3 py-1 rounded-full">'''
          insert = '''<div class="mt-3 inline-flex rounded-full bg-gray-100 p-1 shadow-inner" id="semesterSwitch">
              <button id="frontSemesterBtn" onclick="switchSemester('front')" class="px-5 py-2 rounded-full font-bold text-sm md:text-base transition-all">前期</button>
              <button id="backSemesterBtn" onclick="switchSemester('back')" class="px-5 py-2 rounded-full font-bold text-sm md:text-base transition-all">後期</button>
          </div>
          '''
          if 'id="semesterSwitch"' not in s:
              s = s.replace(marker, insert + marker, 1)

          # Add a back-term section after the existing two tables.
          marker2 = '''        <!-- 全クリアバナー -->'''
          back = '''        <div id="backSection" class="hidden">
            <div class="overflow-x-auto mb-8">
                <table class="test-table w-full bg-white text-center text-lg">
                    <thead><tr class="bg-blue-100">
                        <th class="py-3 px-2 w-24">級</th>
                        <th class="py-3 px-2 w-1/6">13</th><th class="py-3 px-2 w-1/6">14</th><th class="py-3 px-2 w-1/6">15</th>
                        <th class="py-3 px-2 w-1/6">16</th><th class="py-3 px-2 w-1/6">17</th><th class="py-3 px-2 w-1/6">18</th>
                    </tr></thead>
                    <tbody id="backTableBody1"></tbody>
                </table>
            </div>
            <div class="overflow-x-auto mb-8">
                <table class="test-table w-full bg-white text-center text-lg">
                    <thead><tr class="bg-blue-100">
                        <th class="py-3 px-2 w-24">級</th>
                        <th class="py-3 px-2 w-1/6">19</th><th class="py-3 px-2 w-1/6">20</th><th class="py-3 px-2 w-1/6">21</th>
                        <th class="py-3 px-2 w-1/6">22</th><th class="py-3 px-2 w-1/6">23</th><th class="py-3 px-2 w-1/6">24</th>
                    </tr></thead>
                    <tbody id="backTableBody2"></tbody>
                </table>
            </div>
        </div>

'''
          if 'id="backSection"' not in s:
              s = s.replace(marker2, back + marker2, 1)

          # Update heading text so the active term is visible.
          s = s.replace('''<span class="text-2xl md:text-3xl text-gray-600">（前期）</span>''', '''<span id="semesterTitle" class="text-2xl md:text-3xl text-gray-600">（前期）</span>''', 1)

          # Add the semester-aware controller just before </body>.
          controller = r'''
<script>
/* ===== 前期・後期切り替え ===== */
(function(){
    const SEM_KEY = 'kanjiSemester';
    let currentSemester = localStorage.getItem(SEM_KEY) || 'front';

    function semesterRange(){ return currentSemester === 'front' ? [1,12] : [13,24]; }
    function dataKeys(){
        return currentSemester === 'front'
          ? ['kanjiPassedDates','kanjiLap1Records','kanjiLap']
          : ['kanjiLatePassedDates','kanjiLateLap1Records','kanjiLateLap'];
    }
    function saveActive(){
        const [a,b,c] = dataKeys();
        localStorage.setItem(a, JSON.stringify(state.passedDates));
        localStorage.setItem(b, JSON.stringify([...state.lap1Records]));
        localStorage.setItem(c, String(state.lap));
    }
    function loadActive(){
        const [a,b,c] = dataKeys();
        state.passedDates = JSON.parse(localStorage.getItem(a) || '{}');
        state.lap1Records = new Set(JSON.parse(localStorage.getItem(b) || '[]'));
        state.lap = parseInt(localStorage.getItem(c) || '1');
    }

    window.saveData = saveActive;
    window.isPassed = id => !!state.passedDates[id];
    window.isLap1 = id => state.lap1Records.has(id);
    window.passedList = () => Object.keys(state.passedDates);

    window.calcUnlocked = function(){
        const [minKyu,maxKyu] = semesterRange();
        const u = new Set([`level-1-kyu-${minKyu}`]);
        passedList().forEach(id => {
            const m = id.match(/level-(\d+)-kyu-(\d+)/);
            if (!m) return;
            const level = parseInt(m[1]), kyu = parseInt(m[2]);
            if (level === 1) {
                u.add(`level-2-kyu-${kyu}`);
                if (kyu < maxKyu) u.add(`level-1-kyu-${kyu+1}`);
            } else if (level === 2) {
                u.add(`level-3-kyu-${kyu}`);
            } else if (level === 3 && kyu < maxKyu) {
                u.add(`level-1-kyu-${kyu+1}`);
            }
            u.add(id);
        });
        return u;
    };
    window.isUnlocked = id => calcUnlocked().has(id);
    window.isKyuAllCleared = kyu => [1,2,3].every(lv => isPassed(`level-${lv}-kyu-${kyu}`));
    window.isLevelAllCleared = level => { const [min,max]=semesterRange(); return Array.from({length:max-min+1},(_,i)=>i+min).every(k=>isPassed(`level-${level}-kyu-${k}`)); };

    function badgeFor(kyu, level){
        const base = ((kyu - 1) % 12) + 1;
        const map = {
          1:['fire','炎'],2:['water','水'],3:['nature','自然'],4:['thunder','雷'],5:['ice','氷'],6:['shadow','影'],
          7:['gravity','重力'],8:['wind','風'],9:['earth','大地'],10:['light','光'],11:['moon','月'],12:['psychic','エスパー']
        };
        const [slug,name] = map[base];
        return {name, url:`https://tt-sensei.github.io/edu-assets/assets/web/elements/${slug}/level-${level}/badge.webp`};
    }

    window.generateTable = function(tbodyId, startKyu){
        const tbody=document.getElementById(tbodyId); if(!tbody) return;
        tbody.innerHTML='';
        ['レベル１','レベル２','レベル３'].forEach((levelName,li)=>{
            const level=li+1, levelClear=isLevelAllCleared(level), tr=document.createElement('tr');
            const th=document.createElement('th'); th.className='py-3 px-2 bg-orange-50'; if(levelClear) th.classList.add('row-cleared'); th.textContent=levelName; tr.appendChild(th);
            for(let i=0;i<6;i++){
                const kyu=startKyu+i, cellId=`level-${level}-kyu-${kyu}`, badge=badgeFor(kyu,level);
                const unlocked=isUnlocked(cellId), passed=isPassed(cellId), lap1Done=isLap1(cellId), kyuClear=isKyuAllCleared(kyu);
                const iconHtml=unlocked?`<img class="element-badge" src="${badge.url}" alt="${badge.name}エレメント Lv.${level}">`:'🔒';
                const iconCls=!unlocked?'item-locked':passed?((state.lap===2&&lap1Done)?'item-passed-lap2':'item-passed do-pop'):'item-challenge';
                const td=document.createElement('td'); td.className='p-0 cursor-pointer hover:bg-orange-100 transition-colors duration-200';
                if(kyuClear&&levelClear)td.classList.add('both-cleared'); else if(kyuClear)td.classList.add('col-cleared'); else if(levelClear)td.classList.add('row-cleared');
                if(state.lap===2&&lap1Done&&!passed)td.classList.add('lap2-cell');
                const ext=currentSemester==='front'?'jpg':'png';
                td.onclick=()=>openModal(cellId,kyu,levelName,`kanji_test_${level}`,`${kyu}.${ext}`,badge.name,level);
                if(selectedCellIds.has(cellId))td.classList.add('cell-selected');
                td.innerHTML=`<div class="cell-content"><input class="cell-select" type="checkbox" aria-label="${kyu}級 レベル${level}を選択" ${selectedCellIds.has(cellId)?'checked':''} ${passed?'disabled':''} onclick="event.stopPropagation()" style="${bulkSelectMode?'':'display:none;'}" onchange="toggleCellSelection('${cellId}', this.checked)"><span class="item-icon ${iconCls}">${iconHtml}</span><span class="item-date">${passed?state.passedDates[cellId]:''}</span></div>`;
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        });
    };

    window.refreshTable = function(){
        const front = currentSemester==='front';
        document.getElementById('frontSemesterBtn').className='px-5 py-2 rounded-full font-bold text-sm md:text-base transition-all '+(front?'bg-white text-orange-500 shadow':'text-gray-500');
        document.getElementById('backSemesterBtn').className='px-5 py-2 rounded-full font-bold text-sm md:text-base transition-all '+(!front?'bg-white text-blue-500 shadow':'text-gray-500');
        document.getElementById('semesterTitle').textContent=front?'（前期）':'（後期）';
        document.getElementById('frontSection')?.classList.toggle('hidden',!front);
        document.getElementById('backSection')?.classList.toggle('hidden',front);
        if(front){
            document.getElementById('tableBody1').innerHTML=''; document.getElementById('tableBody2').innerHTML='';
            generateTable('tableBody1',1); generateTable('tableBody2',7);
        }else{
            generateTable('backTableBody1',13); generateTable('backTableBody2',19);
        }
        updateProgress(); checkAllClear();
    };

    window.updateProgress=function(){
        const n=passedList().length, total=36;
        document.getElementById('progressText').textContent=`${n} / ${total}`;
        document.getElementById('progressBar').style.width=`${Math.min(100,n/total*100)}%`;
    };
    window.checkAllClear=function(){ document.getElementById('allClearBanner').classList.toggle('hidden',passedList().length<36); };

    window.openModal=function(cellId,kyu,levelName,folder,file,emoji,level){
        currentCellId=cellId; currentKyu=kyu; currentLevel=level; currentEmoji=emoji;
        modalTitle.textContent=`${currentSemester==='front'?'前期':'後期'}・${kyu}級 - ${levelName}`;
        modalImage.style.display='none'; imagePlaceholder.classList.add('hidden'); modalImage.src=''; applyPassButtonState();
        modalImage.onload=()=>{modalImage.style.display='block';imagePlaceholder.classList.add('hidden');};
        modal.classList.remove('hidden'); modal.classList.add('flex');
        setTimeout(()=>{modalContent.classList.remove('scale-95','opacity-0');modalContent.classList.add('scale-100','opacity-100');modalImage.src=`${folder}/${file}`;},10);
    };

    window.executePass=function(){ state.passedDates[currentCellId]=todayStr(); saveData(); launchConfetti(); refreshTable(); closeModal(); };
    window.executeCancel=function(){ delete state.passedDates[currentCellId]; saveData(); refreshTable(); closeModal(); };
    window.executeBulkPass=function(){ selectedCellIds.forEach(id=>state.passedDates[id]=todayStr()); selectedCellIds.clear(); saveData(); launchConfetti(); refreshTable(); };
    window.checkPassword=function(){
        if(bulkPassMode){
            if(passwordInput.value==='8818'){closePasswordModal();executeBulkPass();}else{passwordError.classList.remove('hidden');passwordInput.value='';passwordInput.focus();}
        }else if(passwordInput.value===getPassword(currentKyu,currentLevel)){closePasswordModal();executePass();}
        else{passwordError.classList.remove('hidden');passwordInput.value='';passwordInput.focus();}
    };
    window.startLap2=function(){openConfirmModal(`${currentSemester==='front'?'前期':'後期'}を2周目にします！\n1周目の記録は色を変えて残ります。\nよろしいですか？`,()=>{state.lap1Records=new Set(passedList());state.passedDates={};state.lap=2;saveData();refreshTable();});};
    window.resetProgress=function(){openConfirmModal(`${currentSemester==='front'?'前期':'後期'}のクリア記録をすべて消去します。\n本当によろしいですか？`,()=>{const [a,b,c]=dataKeys();[a,b,c].forEach(k=>localStorage.removeItem(k));location.reload();});};

    window.switchSemester=function(next){
        if(next===currentSemester) return;
        saveActive(); currentSemester=next; localStorage.setItem(SEM_KEY,next); loadActive(); selectedCellIds.clear(); bulkSelectMode=false; document.getElementById('bulkPassButton').textContent='🛡️ 一括合格を選択'; refreshTable();
    };

    // Move the two existing front tables into a wrapper, then render the selected term.
    const body=document.body;
    const allClear=document.getElementById('allClearBanner');
    if(!document.getElementById('frontSection')){
        const wrapper=document.createElement('div'); wrapper.id='frontSection';
        const tables=[...document.querySelectorAll('tbody#tableBody1, tbody#tableBody2')].map(x=>x.closest('.overflow-x-auto'));
        const parent=allClear.parentNode; parent.insertBefore(wrapper,allClear); tables.forEach(t=>wrapper.appendChild(t));
    }
    loadActive();
    refreshTable();
    if(state.lap===2) document.getElementById('lapBadge').classList.remove('hidden'); else document.getElementById('lapBadge').classList.add('hidden');
})();
</script>
'''
          s = s.replace('</body>', controller + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .semester-update-trigger .github/workflows/semester-update.yml
          git add index.html .semester-update-trigger .github/workflows/semester-update.yml
          git commit -m "Add front/back semester switch and late-term tests" || exit 0
          git push
