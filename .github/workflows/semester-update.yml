name: Add semester switch
on:
  push:
    paths:
      - '.semester-update-trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 patch_semester.py
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .semester-update-trigger .github/workflows/semester-update.yml patch_semester.py
          git add -A
          git commit -m "Add front/back semester switch and late-term tests"
          git push
