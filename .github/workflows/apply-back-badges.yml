name: Apply back semester badges
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply badges
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const badge=(k,l)=>{const [slug,name]=badgeMap[((k-1)%12)+1];return{name,url:`https://tt-sensei.github.io/edu-assets/assets/web/elements/${slug}/level-${l}/badge.webp`};};"
          new = "const badge=(k,l)=>{const [slug,name]=badgeMap[k];return{name,url:`https://tt-sensei.github.io/edu-assets/assets/web/elements/${slug}/level-${l}/badge.webp`};};"
          if old not in s:
              raise SystemExit('badge function not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '後期バッジの級別割り当てを修正'
          git pull --rebase origin main
          git push origin main
