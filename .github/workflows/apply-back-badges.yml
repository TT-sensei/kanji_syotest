name: Apply back semester badges and tablet layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('width: 56px;\n            height: 56px;', 'width: 76px;\n            height: 76px;'),
            ('min-height: 64px;', 'min-height: 82px;'),
            ('gap: 2px;\n            padding: 4px 2px;', 'gap: 1px;\n            padding: 2px 1px;'),
            ('<body class="p-4 md:p-8 text-gray-800">', '<body class="p-2 md:p-3 text-gray-800">'),
            ('max-w-5xl mx-auto bg-white/95 backdrop-blur-sm rounded-3xl shadow-xl p-6 md:p-10', 'max-w-6xl mx-auto bg-white/95 backdrop-blur-sm rounded-3xl shadow-xl p-2 md:p-4'),
            ('gap-4 mb-6 border-b-4 border-orange-300 pb-4', 'gap-2 mb-2 border-b-4 border-orange-300 pb-2'),
            ('class="mt-3 inline-flex rounded-full', 'class="mt-1 inline-flex rounded-full'),
            ('class="mb-8 text-lg md:text-xl leading-relaxed bg-orange-50 p-4', 'class="mb-3 text-base md:text-lg leading-snug bg-orange-50 p-2'),
            ('overflow-x-auto mb-8', 'overflow-x-auto mb-3'),
            ('class="py-3 px-2 w-24"', 'class="py-1 px-1 w-20"'),
            ('class="py-3 px-2 w-1/6"', 'class="py-1 px-1 w-1/6"'),
            ('class="py-3 px-1 w-1/6"', 'class="py-1 px-1 w-1/6"')
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'タブレット向けに余白を整理しバッジを拡大'
          git pull --rebase origin main
          git push origin main
