name: Apply back semester badges
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply badges
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''const badgeMap={1:['fire','炎'],2:['water','水'],3:['nature','自然'],4:['thunder','雷'],5:['ice','氷'],6:['shadow','影'],7:['gravity','重力'],8:['wind','風'],9:['earth','大地'],10:['light','光'],11:['moon','月'],12:['psychic','エスパー']};'''
          new = '''const badgeMap={1:['fire','炎'],2:['water','水'],3:['nature','自然'],4:['thunder','雷'],5:['ice','氷'],6:['shadow','影'],7:['gravity','重力'],8:['wind','風'],9:['earth','大地'],10:['light','光'],11:['moon','月'],12:['psychic','エスパー'],13:['bubble','バブル'],14:['candy','キャンディ'],15:['cloud','雲'],16:['cosmos','宇宙'],17:['dream','夢'],18:['fairy','妖精'],19:['flower','花'],20:['heart','ハート'],21:['luck','幸運'],22:['rain','雨'],23:['rainbow','虹'],24:['sound','音']};'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('badgeMap not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '後期13〜24級のバッジを未使用エレメントに変更'
          git pull --rebase origin main
          git push origin main
